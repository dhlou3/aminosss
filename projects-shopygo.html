<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopyGo - E-Commerce Project | Amine</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            min-height: 100vh;
        }

        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 30px 60px;
        }

        .project-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .project-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .project-desc {
            font-size: 1.15rem;
            color: #9ca3af;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        .project-desc strong {
            color: #f97316;
        }

        .screenshot-section {
            margin-bottom: 50px;
        }

        .screenshot-wrapper {
            background: linear-gradient(135deg, #ef4444, #f97316, #eab308);
            padding: 4px;
            border-radius: 16px;
            box-shadow:
                0 25px 60px rgba(239, 68, 68, 0.3),
                0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .screenshot-inner {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
        }

        .screenshot-inner img {
            width: 100%;
            height: auto;
            display: block;
        }

        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 22px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cta-section {
            text-align: center;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(239, 68, 68, 0.5);
        }

        .cta-btn svg {
            width: 18px;
            height: 18px;
        }

        .built-text {
            margin-top: 24px;
            color: #10b981;
            font-size: 0.95rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 80px 20px 40px;
            }

            .project-title {
                font-size: 2.2rem;
            }

            .project-desc {
                font-size: 1rem;
            }

            .back-btn {
                top: 16px;
                left: 16px;
                padding: 10px 16px;
            }
        }
    </style>
</head>

<body>
    <a href="projects-web.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back
    </a>

    <div class="container">
        <header class="project-header">
            <span class="badge">E-Commerce Project</span>
            <h1 class="project-title">ShopyGo</h1>
            <p class="project-desc">
                A complete e-commerce platform for electronics in Tunisia.
                <strong>I built everything</strong> — design, front-end, admin dashboard, and integrations.
            </p>
        </header>

        <section class="screenshot-section">
            <div class="screenshot-wrapper">
                <div class="screenshot-inner">
                    <img src="images/shopygo-homepage.png" alt="ShopyGo E-Commerce Website">
                </div>
            </div>
        </section>

        <div class="features">
            <span class="feature">🛒 Full Store</span>
            <span class="feature">📊 Admin Panel</span>
            <span class="feature">📱 WhatsApp Orders</span>
            <span class="feature">🎨 Responsive Design</span>
            <span class="feature">🏷️ Promotions</span>
        </div>

        <div class="cta-section">
            <a href="https://shopygo.site" target="_blank" class="cta-btn">
                Visit Live Site
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
            <p class="built-text">✓ Built Entirely by Me</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
